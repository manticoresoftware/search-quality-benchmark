  vector_field: "embedding"
  vector_distance: "cosine"
  hybrid_alpha: 0.5

milvus:
  type: "milvus"
  uri: "http://127.0.0.1:19530"
  token: ""
  token_file: ""
  database: "default"
  timeout_seconds: 60
  batch_size: 500
  index_concurrency: 1
  collection_name: "trec_covid_milvus"
  index_layout: "combined"
  text_fields: ["title", "abstract"]
  content_field: "content"
  doc_id_max_length: 2048
  dense_vector_field: "embedding"
  sparse_vector_field: "sparse"
  dense_index_type: "AUTOINDEX"
  dense_metric_type: "COSINE"
  dense_index_params: {}
  dense_search_params: {}
  sparse_index_algorithm: "DAAT_MAXSCORE"
  sparse_drop_ratio_search: 0.0
  bm25_k1: 1.2
  bm25_b: 0.75
  hybrid_rrf_k: 60
  hybrid_candidates: 400
  consistency_level: "Strong"

mariadb:
  type: "mariadb"
  host: "127.0.0.1"
  port: 3307
  user: "bench"
  password: "bench"
  database: "search_bench"
  table_name: "trec_covid_mariadb"
  index_layout: "combined"
  text_fields: ["title", "abstract"]
  vector_field: "embedding"
  vector_distance: "cosine"
  vector_m: 8
  fulltext_search_mode: "natural"
  hybrid_alpha: 0.5
  hybrid_rrf_k: 60
  hybrid_candidates: 400
  batch_size: 100
  index_concurrency: 8
  connect_timeout_seconds: 10
  query_timeout_seconds: 60
  index_timeout_seconds: 3600
  index_progress_interval_seconds: 5

serenedb:
  type: "serenedb"
  host: "127.0.0.1"
  port: 7890
  user: "postgres"
  password: "bench"
  database: "postgres"
  table_name: "trec_covid_serenedb"
  index_layout: "combined"
  text_fields: ["title", "abstract"]
  # Require a modest share of query terms. Pure wide OR queries can crash
  # SereneDB 26.10.1 on verbose datasets such as ArguAna.
  fulltext_min_match_ratio: 0.1
  vector_field: "embedding"
  vector_metric: "cosine"
  vector_index_type: "ivf"
  vector_quantization: "sq8"
  # SereneDB 26.10.1 can crash in the 4096-dimensional ANN query path.
  # Exact base-table scans are stable and keep the benchmark reproducible.
  vector_query_mode: "exact"
  vector_search_nprobe: 8
  vector_rerank_factor: 4
  hybrid_alpha: 0.5
  hybrid_rrf_k: 60
  hybrid_candidates: 400
  batch_size: 500
  index_concurrency: 1
  connect_timeout_seconds: 10
  query_timeout_seconds: 60

weaviate:
  type: "weaviate"
  url: "http://127.0.0.1:8080"
