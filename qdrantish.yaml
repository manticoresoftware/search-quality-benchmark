# Qdrantish Manticore profile variants split out from the main config.

trec_covid_manticore_fulltext_qdrantish:
  base: "manticore"
  type: "fulltext"
  fulltext_table: "trec_covid_manticore_qdrantish"
  vector_table: "trec_covid_manticore_qdrantish"
  fulltext_query_variant: "long"
  vector_cache_path: "vector_cache/trec-covid-openai.sqlite"

trec_covid_manticore_hybrid_qdrantish:
  base: "trec_covid_manticore_fulltext_qdrantish"
  type: "hybrid"
  fulltext_table: "trec_covid_manticore_qdrantish"
  vector_table: "trec_covid_manticore_qdrantish"
  vector_quantization: "1bit"
  vector_search_oversampling: 3.0
  vector_search_rescore: 1
  batch_size: 250
  query_timeout_seconds: 180

msmarco_passage_manticore_fulltext_qdrantish:
  base: "manticore"
  type: "fulltext"
  source: "msmarco-passage/dev/small"
  fulltext_table: "msmarco_passage_manticore_qdrantish"
  vector_table: "msmarco_passage_manticore_qdrantish"
  vector_cache_path: "vector_cache/msmarco-passage-embeddings.sqlite"
  fulltext_query_variant: "long"

msmarco_passage_manticore_hybrid_qdrantish:
