  vector_table: "msmarco_passage_manticore_qdrantish"
  vector_cache_path: "vector_cache/msmarco-passage-embeddings.sqlite"
  vector_quantization: "1bit"
  vector_search_oversampling: 3.0
  vector_search_rescore: 1
  batch_size: 250
  query_timeout_seconds: 180

msmarco_lite_manticore_fulltext_qdrantish:
  base: "msmarco_passage_manticore_fulltext_qdrantish"
  max_docs: 250000
  keep_qrels_docs: true
  fulltext_table: "msmarco_lite_manticore_qdrantish"
  vector_table: "msmarco_lite_manticore_qdrantish"

msmarco_lite_manticore_hybrid_qdrantish:
