[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "search-bench"
version = "0.1.0"
description = "Search Quality Benchmark: ranking quality of open-source search engines on public IR datasets"
readme = "README.md"
license = "MIT AND OFL-1.1"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/bench/report_fonts/OFL.txt"]
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "huggingface_hub>=0.23.0",
  "ir-datasets>=0.5.10",
  "elasticsearch>=8.19.0,<9",
  "meilisearch>=0.40.0",
  "opensearch-py>=2.6.0",
  "pymilvus==3.0.2",
  "pymysql>=1.1.0",
  "psycopg[binary]>=3.2.0,<4",
  "qdrant-client[fastembed]>=1.17.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
bench = "bench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bench = ["report_fonts/*"]
