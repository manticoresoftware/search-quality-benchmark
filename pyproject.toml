[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trec-covid-bench"
version = "0.1.0"
description = "CLI benchmark app for TREC-COVID on Manticore Search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "huggingface_hub>=0.23.0",
  "ir-datasets>=0.5.10",
  "elasticsearch>=8.19.0,<9",
  "meilisearch>=0.40.0",
  "opensearch-py>=2.6.0",
  "pymilvus==3.0.2",
  "pymysql>=1.1.0",
  "qdrant-client>=1.17.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
bench = "bench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
