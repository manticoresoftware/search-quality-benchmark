services:
  manticore:
    container_name: manticore
    image: manticoresearch/manticore:29.9.0
    ports:
      - "9306:9306"
      - "9308:9308"
    volumes:
      - ./data/manticore_storage:/var/lib/manticore

  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage

  meilisearch:
    container_name: meilisearch
    image: getmeili/meilisearch:v1.53.2
    ports:
      - "7700:7700"
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ./data/meilisearch_data:/meili_data

  opensearch:
    container_name: opensearch
    image: opensearchproject/opensearch:3.8.0
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      plugins.security.ssl.http.enabled: "false"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "YourStrongPassword123!"
    volumes:
      - ./data/opensearch_data:/usr/share/opensearch/data

  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    ports:
      - "9201:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - ./data/elasticsearch_data:/usr/share/elasticsearch/data

  typesense:
    container_name: typesense
    image: typesense/typesense:30.2
    ports:
      - "8108:8108"
    command:
      - --data-dir
      - /data
      - --api-key=xyz
      - --enable-cors
    volumes:
      - ./data/typesense_data:/data

  mariadb:
    container_name: mariadb-vector
    image: mariadb:11.8.9
    command:
      - --innodb-buffer-pool-size=${MARIADB_INNODB_BUFFER_POOL_SIZE:-32G}
      - --mhnsw-max-cache-size=${MARIADB_MHNSW_MAX_CACHE_SIZE:-8G}
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: "root"
      MARIADB_DATABASE: "search_bench"
      MARIADB_USER: "bench"
      MARIADB_PASSWORD: "bench"
    volumes:
      - ./data/mariadb_data:/var/lib/mysql

  weaviate:
    container_name: weaviate
    image: cr.weaviate.io/semitechnologies/weaviate:1.39.5
    ports:
      - "8080:8080"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      CLUSTER_HOSTNAME: "node1"
    volumes:
      - ./data/weaviate_data:/var/lib/weaviate

  vespa:
    container_name: vespa
    image: vespaengine/vespa:8.751.13
    user: "1000:1000"
    ports:
      - "8081:8080"
      - "19071:19071"
    volumes:
      - ./data/vespa_data:/opt/vespa/var
      - ./data/vespa_logs:/opt/vespa/logs
