services:
  manticore:
    container_name: manticore
    image: manticoresearch/manticore:29.9.0
    ports:
      - "9306:9306"
      - "9308:9308"
    volumes:
      - ./data/manticore_storage:/var/lib/manticore

  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage

  meilisearch:
    container_name: meilisearch
    image: getmeili/meilisearch:v1.53.2
    ports:
      - "7700:7700"
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ./data/meilisearch_data:/meili_data

  opensearch:
    container_name: opensearch
    image: opensearchproject/opensearch:3.8.0
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      plugins.security.ssl.http.enabled: "false"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "YourStrongPassword123!"
    volumes:
      - ./data/opensearch_data:/usr/share/opensearch/data

  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    ports:
      - "9201:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - ./data/elasticsearch_data:/usr/share/elasticsearch/data

  typesense:
    container_name: typesense
    image: typesense/typesense:30.2
    ports:
      - "8108:8108"
    command:
      - --data-dir
      - /data
      - --api-key=xyz
      - --enable-cors
    volumes:
      - ./data/typesense_data:/data

  milvus:
    container_name: milvus
    image: milvusdb/milvus:v3.0.2
    security_opt:
      - seccomp:unconfined
    command: ["milvus", "run", "standalone"]
    environment:
      COMMON_STORAGE_USELOONFFI: "true"
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - ./data/milvus_data:/var/lib/milvus
      - ./docker/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s

  mariadb:
    container_name: mariadb-vector
    image: mariadb:11.8.9
    command:
      - --innodb-buffer-pool-size=${MARIADB_INNODB_BUFFER_POOL_SIZE:-32G}
      - --mhnsw-max-cache-size=${MARIADB_MHNSW_MAX_CACHE_SIZE:-8G}
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: "root"
      MARIADB_DATABASE: "search_quality_benchmark"
      MARIADB_USER: "bench"
      MARIADB_PASSWORD: "bench"
    volumes:
      - ./data/mariadb_data:/var/lib/mysql

  serenedb:
    container_name: serenedb
    image: serenedb/serenedb:26.10.1
    ports:
      - "7890:7890"
    environment:
      POSTGRES_PASSWORD: "bench"
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    volumes:
      - ./data/serenedb_data:/var/lib/serenedb

  weaviate:
    container_name: weaviate
    image: cr.weaviate.io/semitechnologies/weaviate:1.39.5
    ports:
      - "8080:8080"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      CLUSTER_HOSTNAME: "node1"
    volumes:
      - ./data/weaviate_data:/var/lib/weaviate

  vespa:
    container_name: vespa
    image: vespaengine/vespa:8.751.13
    user: "1000:1000"
    ports:
      - "8081:8080"
      - "19071:19071"
    volumes:
      - ./data/vespa_data:/opt/vespa/var
      - ./data/vespa_logs:/opt/vespa/logs
